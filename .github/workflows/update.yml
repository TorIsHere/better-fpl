name: Update board

on:
  schedule:
    # 06:15 UTC daily. Price changes land at ~01:30 UTC, so this picks up
    # the previous night's moves. Cron on GitHub is best-effort, not exact.
    - cron: '15 6 * * *'
  workflow_dispatch:        # lets you trigger a rebuild by hand
  push:
    paths:
      - 'data/overrides.yml'   # rebuild immediately when you edit your reads
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Build board
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Update board — $(date -u '+%Y-%m-%d')"
            git push
          fi
